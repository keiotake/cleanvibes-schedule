<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 CleanVibes スケジュール</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
  <header class="page-header">
    <h1>🌟 CleanVibes スケジュール</h1>
    <p class="lead">現場・イベントへの参加可否を共有</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="site">🧹 現場</button>
    <button class="tab" data-tab="event">🎉 その他イベント</button>
  </nav>

  <div class="tab-help" id="tab-help"></div>

  <div class="name-input card" id="name-input-section" hidden>
    <label class="field">
      <span class="field-label">あなたの名前 <span class="required">必須</span><span class="hint">回答時に名前として表示されます（ブラウザに記憶）</span></span>
      <input type="text" id="my-name" maxlength="50" placeholder="例：田中">
    </label>
  </div>

  <div id="entries-list"></div>

  <!-- Add form for SITE -->
  <div class="card add-card" id="add-card-site">
    <h2>+ 現場を追加</h2>
    <form id="add-form-site" class="add-form">
      <label class="field field-title">
        <span class="field-label">現場名 <span class="required">必須</span></span>
        <input type="text" id="new-site-title" required maxlength="100" placeholder="例：大室山">
      </label>
      <label class="field field-date">
        <span class="field-label">日付 <span class="required">必須</span></span>
        <input type="date" id="new-site-date" required>
      </label>
      <label class="field field-time">
        <span class="field-label">開始 <span class="required">必須</span></span>
        <input type="time" id="new-site-start" value="06:30" step="300" required>
      </label>
      <label class="field field-time">
        <span class="field-label">終了（任意）</span>
        <input type="time" id="new-site-end" step="300">
      </label>
      <label class="field field-detail">
        <span class="field-label">詳細・作業内容（任意）</span>
        <input type="text" id="new-site-details" maxlength="500" placeholder="例：路肩、除草、苔">
      </label>
      <label class="field field-detail">
        <span class="field-label">地図URL（任意・空欄なら自動検索）</span>
        <input type="url" id="new-site-map" maxlength="500" placeholder="https://maps.app.goo.gl/...">
      </label>
      <div class="field field-submit">
        <button type="submit" class="primary">追加</button>
      </div>
    </form>
  </div>

  <!-- Add form for EVENT (multi-slot) -->
  <div class="card add-card" id="add-card-event" hidden>
    <h2>+ イベントを追加</h2>
    <form id="add-form-event" class="add-form-event">
      <label class="field">
        <span class="field-label">イベント名 <span class="required">必須</span></span>
        <input type="text" id="new-event-title" required maxlength="100" placeholder="例：プロカメラマンの撮影日時">
      </label>
      <label class="field">
        <span class="field-label">詳細・備考（任意）</span>
        <input type="text" id="new-event-details" maxlength="500" placeholder="例：場所未定、撮影時間1時間程度">
      </label>
      <label class="field">
        <span class="field-label">地図URL（任意）</span>
        <input type="url" id="new-event-map" maxlength="500" placeholder="https://maps.app.goo.gl/...">
      </label>
      <div class="field">
        <span class="field-label">候補日時 <span class="required">必須</span><span class="hint">複数追加できます。メンバーが日時ごとに参加可否を投票します。</span></span>
        <div id="new-slots"></div>
        <button type="button" id="add-slot-btn" class="add-slot-btn">+ 候補日時を追加</button>
      </div>
      <div class="field">
        <button type="submit" class="primary">イベントを作成</button>
      </div>
    </form>
  </div>
</div>

<dialog id="edit-dialog" class="edit-dialog">
  <form id="edit-form">
    <h2 id="edit-dialog-title">編集</h2>
    <label class="field">
      <span class="field-label" id="edit-title-label">タイトル</span>
      <input type="text" id="edit-title-input" maxlength="100" required>
    </label>

    <!-- Site fields -->
    <div id="edit-site-fields">
      <div class="field-row">
        <label class="field">
          <span class="field-label">日付</span>
          <input type="date" id="edit-date" required>
        </label>
        <label class="field">
          <span class="field-label">開始</span>
          <input type="time" id="edit-start" step="300" required>
        </label>
        <label class="field">
          <span class="field-label">終了</span>
          <input type="time" id="edit-end" step="300">
        </label>
      </div>
    </div>

    <!-- Event slot fields -->
    <div id="edit-event-fields" hidden>
      <div class="field">
        <span class="field-label">候補日時</span>
        <div id="edit-slots"></div>
        <button type="button" id="edit-add-slot-btn" class="add-slot-btn">+ 候補日時を追加</button>
      </div>
    </div>

    <label class="field">
      <span class="field-label">詳細・作業内容</span>
      <input type="text" id="edit-details" maxlength="500">
    </label>
    <label class="field">
      <span class="field-label">地図URL</span>
      <input type="url" id="edit-map" maxlength="500" placeholder="https://maps.app.goo.gl/...">
    </label>
    <div class="form-actions">
      <button type="button" id="edit-save" class="primary">保存</button>
      <button type="button" id="edit-cancel" class="secondary">キャンセル</button>
      <button type="button" id="edit-delete" class="danger">削除</button>
    </div>
  </form>
</dialog>

<script src="/index.js"></script>
</body>
</html>
