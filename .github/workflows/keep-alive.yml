name: Keep Render services awake

on:
  schedule:
    # 10分おきに実行（Render無料プランの15分アイドル休止を回避）
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping CleanVibes
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://cleanvibes.onrender.com/api/entries?type=site")
          echo "cleanvibes: $code"
          [ "$code" = "200" ] || exit 1
      - name: Ping Chousei
        if: always()
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://chousei-76e7.onrender.com/api/members")
          echo "chousei: $code"
          [ "$code" = "200" ] || exit 1
