name: Keep Render services awake

on:
  schedule:
    # 5分おきに実行（Render無料プランの15分アイドル休止を確実に回避）
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping CleanVibes (DB warm)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://cleanvibes.onrender.com/api/entries?type=site")
          echo "cleanvibes: $code"
          [ "$code" = "200" ] || exit 1
      - name: Ping Chousei (DB warm)
        if: always()
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://chousei-76e7.onrender.com/api/inspections")
          echo "chousei: $code"
          [ "$code" = "200" ] || exit 1
